# Cấu hình đường dẫn và tham số cho dự án Neuro-Symbolic + MDE Process Mining
paths:
  raw_directive_pdf: "datasets/directive_2008_48_EC.pdf"
  raw_event_log_xes: "datasets/BPI Challenge 2017.xes"
  interim_dir: "data/interim"
  bpic2017_parquet_cache: "data/interim/bpic2017_events.parquet"
  processed_dir: "data/processed"
  directive_chunks_json: "data/processed/directive_chunks.json"
  process_schema_json: "data/processed/process_schema.json"
  verified_constraints_json: "data/processed/verified_constraints.json"
  verified_constraints_decl: "data/processed/verified_constraints.decl"
  results_dir: "results"
  layer3_conformance_report_json: "results/layer3_conformance_report.json"
  step4_accountable_audit_reports_json: "results/step4_accountable_audit_reports.json"

preprocessing:
  directive:
    min_article: 1
    max_article: 24
  event_log:
    min_transition_frequency: 500
    max_frequent_transitions: 30
    sample_values_count: 3

synthesis_and_verification:
  max_layer2_retries: 4
  max_layer3_semantic_repairs: 2
  auditor_temperature: 0.0
  taxonomy_labels:
    - "ENTAILED"
    - "CONTRADICTED"
    - "BASELESS"
